[project]
name = "excel-automation"
version = "0.1.0"
description = "Program to retrieve a batch of three claves and their descriptions from .xlsx files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "pyxlsb>=1.0.10",
    "streamlit>=1.61.1",
]

[project.scripts]
excel-automation = "excel_automation:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
